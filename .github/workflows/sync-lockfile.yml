name: Sync npm lockfile

on:
  push:
    branches: [feat/zurify-2.0-foundation]
    paths:
      - "package.json"
      - ".github/workflows/sync-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: sync-lockfile-{github.ref}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zurify-2.0-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): sync npm lockfile"
          git push origin HEAD:feat/zurify-2.0-foundation
